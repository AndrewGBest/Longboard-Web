<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Longboard icon. Original artwork for this project: a longboard deck seen
       from above, inside the white highlight ring the browser draws around
       whatever is selected. Not derived from any product's or service's branding. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16323a"/>
      <stop offset="1" stop-color="#0d1014"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9a15b"/>
      <stop offset="1" stop-color="#d9773f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- the highlight ring -->
  <rect x="62" y="150" width="388" height="212" rx="44" fill="none" stroke="#ffffff" stroke-width="18"/>
  <g transform="rotate(-18 256 256)">
    <!-- wheels, showing either side of the deck -->
    <g fill="#2f6f73">
      <rect x="128" y="196" width="34" height="22" rx="9"/>
      <rect x="128" y="294" width="34" height="22" rx="9"/>
      <rect x="350" y="196" width="34" height="22" rx="9"/>
      <rect x="350" y="294" width="34" height="22" rx="9"/>
    </g>
    <!-- the deck -->
    <rect x="66" y="214" width="380" height="84" rx="42" fill="url(#deck)"/>
    <!-- a stripe along it, and the truck bolts -->
    <rect x="96" y="250" width="320" height="12" rx="6" fill="#fff3e2" opacity=".85"/>
    <g fill="#5b2d14">
      <circle cx="137" cy="238" r="5"/><circle cx="153" cy="238" r="5"/><circle cx="137" cy="274" r="5"/><circle cx="153" cy="274" r="5"/>
      <circle cx="359" cy="238" r="5"/><circle cx="375" cy="238" r="5"/><circle cx="359" cy="274" r="5"/><circle cx="375" cy="274" r="5"/>
    </g>
  </g>
</svg>
